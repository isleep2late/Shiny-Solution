name: build-desktop
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          cd electron
          bash build.sh --stage-only        # never --with-hunt: a published build carries no webapp/hunt/ code
          npm install --no-audit --no-fund
          npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: shiny-solution-mac
          path: |
            electron/dist/*.dmg
            electron/dist/*-mac-*.zip
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          cd electron
          bash build.sh --stage-only        # never --with-hunt: a published build carries no webapp/hunt/ code
          npm install --no-audit --no-fund
          npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: shiny-solution-linux
          path: |
            electron/dist/*.AppImage
            electron/dist/*.tar.gz
